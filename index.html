<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PixelArt App</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pixelart.css">
</head>
<body>

  <!-- MARCO DE TELÉFONO MÓVIL -->
  <div class="mobile-frame">
    
    <!-- Notch / Isla dinámica superior -->
    <div class="mobile-notch">
      <div class="camera-lens"></div>
    </div>

    <!-- PANTALLA MÓVIL (Con scroll interno) -->
    <div class="mobile-screen">
      
      <!-- Barra superior estilo App -->
      <header class="app-header">
        <span class="app-status">alfa</span>
        <h1 class="app-title">PixelArt Studio</h1>
        <div class="app-badge">v1.0</div>
      </header>

      <!-- CONTENIDO PRINCIPAL DE TU APP -->
      <main class="app-content view-pixelart">
        
        <!-- Botón Cargar Imagen -->
        <button id="loadImgBtn" class="expand">
          <span>Seleccionar foto</span>
          <div class="expand-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </div>
        </button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <!-- Lienzo (Canvas) -->
        <div class="canvas-wrapper">
          <canvas id="gameboyCanvas" width="160" height="144"></canvas>
        </div>
        <!-- Selector Dithering -->
        <div class="control-group">
          <label>Algoritmo Dithering</label>
          <div id="customDitherSelect" class="custom-select-wrapper">
            <div class="custom-select-trigger">
              <span class="custom-select-text">Ninguno</span>
              <span>▼</span>
            </div>
            <div class="custom-options">
              <div class="custom-option selected" data-value="none">Ninguno (Umbral)</div>
              <div class="custom-option" data-value="bayer4">Matriz Bayer 4x4</div>
              <div class="custom-option" data-value="bayer8">Matriz Bayer 8x8</div>
              <div class="custom-option" data-value="floyd">Floyd-Steinberg</div>
              <div class="custom-option" data-value="atkinson">Atkinson (Mac OS Retro)</div>
              <div class="custom-option" data-value="sierra">Sierra-Lite</div>
            </div>
            <input type="hidden" id="ditherMethod" value="none">
          </div>
        </div>

        <!-- Selector Paleta -->
        <div class="control-group">
          <label>Paleta de Color</label>
          <div id="customPaletteSelect" class="palette-select-wrapper">
            <div class="palette-select-trigger">
              <span class="palette-name-text">grays</span>
              <div id="triggerGradientPreview"></div>
            </div>
            <div id="paletteOptionsGrid" class="palette-options-grid"></div>
            <select id="palettePreset" style="display:none;"></select>
          </div>
        </div>

        <!-- Contenedor dinámico de colores y barra -->
        <div id="paletteContainer"></div>

        <!-- Rejilla de botones -->
        <div class="action-buttons-grid">
          <button id="invertBtn">Invertir ↔️</button>
          <button id="resetBtn">Resetear ↩️</button>
          <button id="save">Guardar 💾</button>
          <button id="delete">Eliminar 🗑️</button>
          <button id="processBtn">Procesar Imagen 🎮</button>
        </div>

        <button id="downloadBtn">Descargar</button>

      </main>

      <!-- Barra inferior del sistema móvil -->
      <footer class="app-home-bar">
        <div class="home-indicator"></div>
      </footer>

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
