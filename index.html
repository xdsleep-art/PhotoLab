<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f380f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Boy Camera Filter</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    canvas {
      border: 2px solid #555;
      margin-top: 20px;
      max-width: 100%;
      /* Mantiene los píxeles nítidos sin suavizado automático */
      image-rendering: pixelated; 
    }

    #gradientBar {
      width: 100%;
      height: 24px;
      border: 1px solid #000000;
      margin: 10px 0;
      box-sizing: border-box;
}
  </style>
</head>
<body>

  <h1>Filtro Game Boy 🎮</h1>
  <input type="file" id="imageInput" accept="image/*">
  <div id="controls" style="margin: 15px 0; text-align: center;">
  <div>
    <label for="ditherMethod">Método de Dithering: </label>
    <select id="ditherMethod">
      <option value="none">Sin tramado</option>
      <option value="threshold">Umbral simple</option>
      <option value="bayer">Matriz Bayer (Retro)</option>
      <option value="floyd">Floyd-Steinberg</option>
    </select>
  </div>
<div style="margin-bottom: 10px;">
  <label for="palettePreset">Preset de Paleta: </label>
  <select id="palettePreset">
    <option value="grays">Escala de Grises ⚪</option>
    <option value="dmg">Game Boy Clásica (DMG) 🟢</option>
  </select>
</div>
  <h3 style="margin-top: 15px;">Paleta de 16 Colores</h3>
  <div id="paletteContainer" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 320px; margin: 0 auto;"></div>
<div style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
  <button id="invertBtn">Invertir ↕️</button>
  <button id="resetBtn">Resetear ↩️</button>
    <button id="save">Guardar color</button>
</div>
  <button id="processBtn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">
    Ejecutar filtro 🎮
  </button>
  <button id="downloadBtn" style="margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer;">
  Guardar imagen 💾
</button>
</div>
  <!-- Canvas final con la resolución objetivo de 1080x972 (proporción 10:9) -->
  <canvas id="gameboyCanvas" width="1080" height="972"></canvas>
  <script src="script copy.js"></script>
</body>
</html>
